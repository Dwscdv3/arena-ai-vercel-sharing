<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>匿名对战对话 · Arena Blind Share</title>
<link rel="icon" href="/favicon.svg">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js" defer></script>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100vh;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #0f1117;
    color: #e2e8f0;
  }
  header.top {
    position: sticky; top: 0; z-index: 10;
    backdrop-filter: blur(12px);
    background: rgba(15, 17, 23, 0.85);
    border-bottom: 1px solid rgba(148, 163, 184, 0.1);
  }
  .top-inner { max-width: 1080px; margin: 0 auto; padding: 12px 20px; display: flex; align-items: center; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; font-weight: 700; letter-spacing: -0.01em; }
  .brand svg { width: 26px; height: 26px; }
  .tag { font-size: 0.68rem; font-weight: 600; color: #fbbf24; background: rgba(251, 191, 36, 0.12); border: 1px solid rgba(251,191,36,.3); padding: 2px 8px; border-radius: 999px; }
  .top-right { margin-left: auto; font-size: 0.8rem; color: #64748b; }
  main { max-width: 1080px; margin: 0 auto; padding: 28px 20px 80px; }
  .meta { color: #64748b; font-size: 0.8rem; margin-bottom: 4px; }
  h1 { font-size: 1.35rem; font-weight: 700; letter-spacing: -0.01em; line-height: 1.4; }
  .turn { margin-top: 26px; }
  .prompt {
    background: rgba(56, 189, 248, 0.07);
    border: 1px solid rgba(125, 211, 252, 0.18);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 14px;
  }
  .prompt .role, .cell .role { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: #7dd3fc; margin-bottom: 8px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }
  .cell { background: rgba(30, 41, 59, 0.4); border: 1px solid rgba(148,163,184,.12); border-radius: 14px; overflow: hidden; }
  .cell-head { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid rgba(148,163,184,.1); background: rgba(15,17,23,.35); }
  .avatar { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; font-weight: 800; font-size: 0.85rem; flex: none; }
  .avatar-a { background: rgba(125,211,252,.15); color: #7dd3fc; }
  .avatar-b { background: rgba(244,114,182,.15); color: #f472b6; }
  .cell-title { font-weight: 600; font-size: 0.92rem; }
  .cell-sub { font-size: 0.72rem; color: #64748b; }
  .cell-body { padding: 14px 16px; font-size: 0.92rem; line-height: 1.75; overflow-x: auto; }
  .cell-body pre { background: #0b0d13; border: 1px solid rgba(148,163,184,.15); padding: 12px; border-radius: 10px; overflow-x: auto; font-size: 0.82rem; margin: 10px 0; }
  .cell-body code { background: #0b0d13; border-radius: 5px; padding: 1px 5px; font-size: 0.85em; }
  .cell-body pre code { padding: 0; background: transparent; }
  .cell-body p { margin: 0 0 10px; } .cell-body p:last-child { margin-bottom: 0; }
  .cell-body ul, .cell-body ol { padding-left: 1.4em; margin-bottom: 10px; }
  .cell-body h1,.cell-body h2,.cell-body h3,.cell-body h4 { margin: 14px 0 8px; font-size: 1.05em; }
  .cell-body table { border-collapse: collapse; margin: 10px 0; }
  .cell-body th, .cell-body td { border: 1px solid rgba(148,163,184,.25); padding: 6px 10px; }
  .vote-panel { margin-top: 30px; border: 1px solid rgba(148,163,184,.15); background: rgba(30,41,59,.35); border-radius: 16px; padding: 22px; text-align: center; }
  .vote-panel h2 { font-size: 1.05rem; margin-bottom: 6px; }
  .vote-panel p.hint { color: #94a3b8; font-size: 0.85rem; margin-bottom: 16px; }
  .vote-buttons { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  button.vote-btn {
    cursor: pointer; border: 1px solid rgba(148,163,184,.3); background: #1e293b; color: #e2e8f0;
    padding: 10px 18px; border-radius: 10px; font-size: 0.9rem; font-weight: 600; font-family: inherit;
    transition: transform .12s ease, border-color .12s ease, background .12s ease;
  }
  button.vote-btn:hover:not(:disabled) { transform: translateY(-1px); border-color: #7dd3fc; }
  button.vote-btn:disabled { cursor: default; opacity: 0.55; }
  button.vote-btn.chosen { border-color: #34d399; background: rgba(52,211,153,.12); color: #6ee7b7; opacity: 1; }
  .results { margin-top: 18px; text-align: left; display: none; }
  .results.visible { display: block; }
  .result-row { display: grid; grid-template-columns: 150px 1fr 56px; gap: 10px; align-items: center; margin: 8px 0; font-size: 0.85rem; }
  .bar { height: 10px; background: #1e293b; border-radius: 999px; overflow: hidden; }
  .bar > span { display: block; height: 100%; background: linear-gradient(90deg, #38bdf8, #818cf8); border-radius: 999px; }
  .thanks { margin-top: 14px; color: #34d399; font-size: 0.85rem; font-weight: 600; }
  .error-box { text-align: center; padding: 80px 20px; color: #94a3b8; }
  .error-box h2 { color: #e2e8f0; margin-bottom: 10px; font-size: 1.2rem; }
  .loading { text-align: center; padding: 80px 20px; color: #64748b; }
  .spinner { width: 34px; height: 34px; border: 3px solid #1e293b; border-top-color: #7dd3fc; border-radius: 50%; margin: 0 auto 16px; animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  footer { text-align: center; color: #475569; font-size: 0.78rem; padding: 24px 0 40px; }
  footer a { color: #64748b; }
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <a class="brand" href="/">
      <svg viewBox="0 0 64 64" fill="none" aria-hidden="true"><circle cx="22" cy="24" r="13" stroke="#7dd3fc" stroke-width="6"/><circle cx="42" cy="24" r="13" stroke="#f472b6" stroke-width="6"/><path d="M12 48h40" stroke="#e2e8f0" stroke-width="6" stroke-linecap="round"/></svg>
      Arena Blind Share
    </a>
    <span class="tag" id="blind-tag">模型名称已隐藏</span>
    <span class="top-right" id="source-link-wrap" hidden><a id="source-link" href="" target="_blank" rel="noopener noreferrer" style="color:#64748b">查看原对话 ↗</a></span>
  </div>
</header>

<main>
  <div class="loading" id="loading"><div class="spinner"></div>正在加载对话…</div>

  <div class="error-box" id="error-box" hidden>
    <h2>无法加载分享</h2>
    <p id="error-message">分享不存在、链接已失效，或服务器尚未配置存储。</p>
  </div>

  <article id="content" hidden>
    <p class="meta" id="meta-line"></p>
    <h1 id="share-title"></h1>
    <div id="turns"></div>

    <section class="vote-panel" id="vote-panel">
      <h2>这个回答哪个更好？</h2>
      <p class="hint">arena.ai 风格匿名投票，投票后才会揭晓两侧的模型名称</p>
      <div class="vote-buttons">
        <button class="vote-btn" data-choice="a">← 模型 A 更好</button>
        <button class="vote-btn" data-choice="tie">平局</button>
        <button class="vote-btn" data-choice="b">模型 B 更好 →</button>
        <button class="vote-btn" data-choice="bad">两个都差</button>
      </div>
      <div class="results" id="results">
        <div id="result-rows"></div>
        <p class="thanks" id="thanks-line"></p>
      </div>
    </section>
  </article>
</main>

<footer>由 <a href="/">Arena Blind Share</a> 生成 · 模型揭晓前完全匿名</footer>

<script>
(function () {
  'use strict';

  var $ = function (sel, root) { return (root || document).querySelector(sel); };
  var $$ = function (sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); };

  function shareIdFromLocation() {
    var parts = window.location.pathname.split('/').filter(Boolean);
    if (parts[0] === 's' && parts[1]) return parts[1];
    var sp = new URLSearchParams(window.location.search);
    return sp.get('id');
  }

  var SHARE_ID = shareIdFromLocation();

  function escapeHtml(text) {
    return String(text)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function renderMarkdown(target, text) {
    var raw = String(text || '');
    try {
      if (window.marked && window.DOMPurify) {
        target.innerHTML = window.DOMPurify.sanitize(window.marked.parse(raw, { breaks: true, gfm: true }));
        return;
      }
    } catch (err) {
      console.error('markdown render failed, falling back to plain text', err);
    }
    target.innerHTML = '<pre style="white-space:pre-wrap">' + escapeHtml(raw) + '</pre>';
  }

  function modelLabel(models, side) {
    if (models && models[side]) return models[side];
    return side === 'a' ? '模型 A' : '模型 B';
  }

  function formatDate(iso) {
    try {
      return new Date(iso).toLocaleString('zh-CN', { dateStyle: 'medium', timeStyle: 'short' });
    } catch (_) { return iso || ''; }
  }

  var state = { models: null, voted: false, tallies: null, revealed: false };

  function applyHeaders() {
    $$('.cell-title[data-side]').forEach(function (el) {
      el.textContent = modelLabel(state.models, el.getAttribute('data-side'));
    });
    $$('.cell-sub[data-side]').forEach(function (el) {
      el.textContent = state.models ? '真实模型（投票后揭晓）' : '匿名，投票后揭晓';
    });
    $('#blind-tag').textContent = state.models ? '模型已揭晓' : '模型名称已隐藏';
    $('#blind-tag').style.color = state.models ? '#6ee7b7' : '#fbbf24';
    $('#blind-tag').style.borderColor = state.models ? 'rgba(110,231,183,.35)' : 'rgba(251,191,36,.3)';
    $('#blind-tag').style.background = state.models ? 'rgba(52,211,153,.1)' : 'rgba(251,191,36,.12)';
  }

  function renderResults() {
    var box = $('#results');
    var rows = $('#result-rows');
    var t = state.tallies;
    if (!t) return;
    var total = Math.max(t.total, 1);
    var items = [
      { label: modelLabel(state.models, 'a') + ' 更好', value: t.a },
      { label: modelLabel(state.models, 'b') + ' 更好', value: t.b },
      { label: '平局', value: t.tie },
      { label: '两个都差', value: t.bad },
    ];
    rows.innerHTML = items.map(function (item) {
      var pct = Math.round((item.value / total) * 100);
      return (
        '<div class="result-row"><span>' + escapeHtml(item.label) + '</span>' +
        '<div class="bar"><span style="width:' + pct + '%"></span></div>' +
        '<span>' + item.value + ' 票</span></div>'
      );
    }).join('');
    $('#thanks-line').textContent = state.voted
      ? ('感谢你的投票！共收到 ' + t.total + ' 张票。')
      : ('共收到 ' + t.total + ' 张票。');
    box.classList.add('visible');
  }

  function disableVoteButtons(chosen) {
    $$('button.vote-btn').forEach(function (btn) {
      btn.disabled = true;
      if (chosen && btn.getAttribute('data-choice') === chosen) btn.classList.add('chosen');
    });
  }

  function renderTurns(turns) {
    var container = $('#turns');
    container.innerHTML = '';
    turns.forEach(function (turn, idx) {
      var turnEl = document.createElement('section');
      turnEl.className = 'turn';

      if (turn.prompt && turn.prompt.trim()) {
        var promptEl = document.createElement('div');
        promptEl.className = 'prompt';
        promptEl.innerHTML = '<div class="role">你 / 提问</div>';
        var promptBody = document.createElement('div');
        renderMarkdown(promptBody, turn.prompt);
        promptEl.appendChild(promptBody);
        turnEl.appendChild(promptEl);
      }

      var grid = document.createElement('div');
      grid.className = 'grid';
      ['a', 'b'].forEach(function (side) {
        var cell = document.createElement('div');
        cell.className = 'cell';
        cell.innerHTML =
          '<div class="cell-head">' +
            '<div class="avatar avatar-' + side + '">' + side.toUpperCase() + '</div>' +
            '<div><div class="cell-title" data-side="' + side + '">' + escapeHtml(modelLabel(state.models, side)) + '</div>' +
            '<div class="cell-sub" data-side="' + side + '"></div></div>' +
          '</div>';
        var body = document.createElement('div');
        body.className = 'cell-body';
        var content = (turn.responses && turn.responses[side]) || '';
        if (content.trim()) {
          renderMarkdown(body, content);
        } else {
          body.innerHTML = '<p style="color:#64748b">（该侧无内容）</p>';
        }
        cell.appendChild(body);
        grid.appendChild(cell);
      });
      turnEl.appendChild(grid);
      container.appendChild(turnEl);
    });
  }

  function showError(message) {
    $('#loading').hidden = true;
    $('#content').hidden = true;
    $('#error-box').hidden = false;
    if (message) $('#error-message').textContent = message;
  }

  function showShare(data) {
    state.models = data.models || null;
    state.voted = Boolean(data.voted);
    state.tallies = data.tallies || null;

    $('#loading').hidden = true;
    $('#error-box').hidden = true;
    $('#content').hidden = false;

    $('#share-title').textContent = data.title || '匿名对战对话';
    $('#meta-line').textContent = '分享于 ' + formatDate(data.created_at) + ' · 第 ' + '#' + data.id.slice(0, 8) + ' 号对话';
    document.title = (data.title || '匿名对战对话') + ' · Arena Blind Share';

    if (data.source_url) {
      var link = $('#source-link');
      link.href = data.source_url;
      $('#source-link-wrap').hidden = false;
    }

    renderTurns(data.turns || []);
    applyHeaders();

    if (state.voted) {
      disableVoteButtons(null);
      renderResults();
    }
  }

  async function castVote(choice) {
    $$('button.vote-btn').forEach(function (b) { b.disabled = true; });
    try {
      var resp = await fetch('/api/vote/' + encodeURIComponent(SHARE_ID), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ choice: choice }),
      });
      var data = await resp.json().catch(function () { return {}; });
      if (!resp.ok) {
        throw new Error((data && data.message) || ('投票失败（HTTP ' + resp.status + '）'));
      }
      state.voted = true;
      state.models = data.models || state.models;
      state.tallies = data.tallies || state.tallies;
      applyHeaders();
      disableVoteButtons(choice);
      renderResults();
    } catch (err) {
      console.error(err);
      alert(err.message || '投票失败，请稍后重试。');
      $$('button.vote-btn').forEach(function (b) { b.disabled = false; });
    }
  }

  $$('button.vote-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      if (state.voted) return;
      castVote(btn.getAttribute('data-choice'));
    });
  });

  (async function load() {
    if (!SHARE_ID) { showError('链接中缺少分享 ID。'); return; }
    try {
      var resp = await fetch('/api/share/' + encodeURIComponent(SHARE_ID), { headers: { 'Accept': 'application/json' } });
      var data = await resp.json().catch(function () { return {}; });
      if (!resp.ok) {
        var msg = (data && data.message) || ('加载失败（HTTP ' + resp.status + '）');
        showError(msg);
        return;
      }
      showShare(data);
    } catch (err) {
      console.error(err);
      showError('网络错误，请稍后重试。');
    }
  })();
})();
</script>
</body>
</html>
