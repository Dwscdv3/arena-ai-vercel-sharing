<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>对话</title>
<link rel="icon" href="/favicon.svg">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js" defer></script>
<style>
  :root {
    color-scheme: light;
    --bg: #ffffff;
    --fg: #111111;
    --muted: #6b6b6b;
    --border: #e4e4e4;
    --card: #f7f7f7;
    --prompt-bg: #f2f2f2;
    --pre-bg: #f5f5f5;
    --shadow: rgba(0, 0, 0, 0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #0a0a0a;
      --fg: #f5f5f5;
      --muted: #a3a3a3;
      --border: #262626;
      --card: #141414;
      --prompt-bg: #161616;
      --pre-bg: #111111;
      --shadow: rgba(0, 0, 0, 0.4);
    }
  }

  * { box-sizing: border-box; margin: 0; }
  html, body { background: var(--bg); }
  body {
    min-height: 100vh;
    color: var(--fg);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  main { max-width: 1080px; margin: 0 auto; padding: 28px 20px 64px; }

  /* ---------- 对话轮次 ---------- */
  .turn { margin-bottom: 28px; scroll-margin-top: 16px; }
  .turn:last-child { margin-bottom: 0; }

  .prompt {
    background: var(--prompt-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 12px;
    font-size: 0.95rem;
    line-height: 1.75;
    overflow-x: auto;
  }

  .answers { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 860px) { .answers { grid-template-columns: 1fr; } }

  .cell {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 1px 2px var(--shadow);
  }
  .cell-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
  }
  .avatar {
    width: 30px; height: 30px; border-radius: 50%;
    display: grid; place-items: center;
    font-weight: 700; font-size: 0.85rem;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--fg);
    flex: none;
  }
  .cell-title { font-weight: 600; font-size: 0.92rem; }

  /* 投票后揭晓的优胜组：绿色边框 + 浅绿底的头部 */
  .cell.winner {
    border-color: #16a34a;
    box-shadow: 0 0 0 2px #16a34a, 0 1px 2px var(--shadow);
  }
  .cell.winner .cell-head { background: rgba(22, 163, 74, 0.08); }
  .winner-badge { font-size: 0.68rem; font-weight: 700; color: #15803d; border: 1px solid currentColor; border-radius: 999px; padding: 1px 8px; margin-left: auto; }
  @media (prefers-color-scheme: dark) {
    .cell.winner { border-color: #22c55e; box-shadow: 0 0 0 2px #22c55e, 0 1px 2px var(--shadow); }
    .cell.winner .cell-head { background: rgba(34, 197, 94, 0.10); }
    .winner-badge { color: #4ade80; }
  }

  .cell-body {
    padding: 14px 16px;
    font-size: 0.93rem;
    line-height: 1.75;
    overflow-x: auto;
    word-break: break-word;
  }

  /* ---------- Markdown 内容（黑白） ---------- */
  .md p { margin: 0 0 10px; }
  .md p:last-child { margin-bottom: 0; }
  .md ul, .md ol { padding-left: 1.5em; margin: 0 0 10px; }
  .md li { margin: 2px 0; }
  .md h1, .md h2, .md h3, .md h4, .md h5, .md h6 {
    font-size: 1em; font-weight: 700; margin: 14px 0 8px; line-height: 1.4;
  }
  .md h1 { font-size: 1.15em; }
  .md h2 { font-size: 1.08em; }
  .md code {
    background: var(--pre-bg);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 1px 5px;
    font-size: 0.85em;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .md pre {
    background: var(--pre-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    overflow-x: auto;
    margin: 10px 0;
    font-size: 0.82rem;
  }
  .md pre code { background: transparent; border: none; padding: 0; font-size: inherit; }
  .md blockquote {
    border-left: 3px solid var(--border);
    color: var(--muted);
    padding-left: 12px;
    margin: 10px 0;
  }
  .md table { border-collapse: collapse; margin: 10px 0; display: block; overflow-x: auto; }
  .md th, .md td { border: 1px solid var(--border); padding: 6px 10px; }
  .md th { background: var(--prompt-bg); }
  .md a { color: var(--fg); text-decoration: underline; text-underline-offset: 2px; }
  .md hr { border: none; border-top: 1px solid var(--border); margin: 14px 0; }
  .md img { max-width: 100%; }

  /* ---------- 每轮投票区（仅标题 + 4 个按钮） ---------- */
  .turn-vote {
    margin-top: 12px;
    border: 1px solid var(--border);
    background: var(--card);
    border-radius: 14px;
    padding: 14px 16px;
    text-align: center;
  }
  .turn-vote h2 { font-size: 0.98rem; font-weight: 700; margin-bottom: 12px; }
  .vote-buttons { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  button.vote-btn {
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--fg);
    padding: 10px 20px;
    border-radius: 10px;
    font-size: 0.9rem;
    font-weight: 600;
    font-family: inherit;
    transition: background .12s ease, color .12s ease, transform .12s ease;
  }
  button.vote-btn:hover:not(:disabled) { transform: translateY(-1px); background: var(--prompt-bg); }
  button.vote-btn:disabled { cursor: default; opacity: 0.5; }
  button.vote-btn.chosen {
    background: var(--fg);
    color: var(--bg);
    border-color: var(--fg);
    opacity: 1;
  }

  /* ---------- 加载 / 错误 ---------- */
  .error-box { text-align: center; padding: 72px 20px; color: var(--muted); }
  .error-box h2 { color: var(--fg); margin-bottom: 10px; font-size: 1.15rem; }
  .loading { text-align: center; padding: 72px 20px; color: var(--muted); }
  .spinner {
    width: 32px; height: 32px;
    border: 3px solid var(--border);
    border-top-color: var(--fg);
    border-radius: 50%;
    margin: 0 auto 16px;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<main>
  <div class="loading" id="loading"><div class="spinner"></div>正在加载对话…</div>

  <div class="error-box" id="error-box" hidden>
    <h2>无法加载对话</h2>
    <p id="error-message">分享不存在、链接已失效，或服务器尚未配置存储。</p>
  </div>

  <article id="content" hidden>
    <div id="turns"></div>
  </article>
</main>

<script>
(function () {
  'use strict';

  var $ = function (sel, root) { return (root || document).querySelector(sel); };
  var $$ = function (sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); };

  function shareIdFromLocation() {
    var parts = window.location.pathname.split('/').filter(Boolean);
    if (parts[0] === 's' && parts[1]) return parts[1];
    var sp = new URLSearchParams(window.location.search);
    return sp.get('id');
  }

  var SHARE_ID = shareIdFromLocation();

  function escapeHtml(text) {
    return String(text)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  var HTML_TAG_RE = /<(?:p|div|ul|ol|li|pre|code|table|thead|tbody|tr|th|td|h[1-6]|blockquote|hr|img|a|strong|em|br|dl|dt|dd|figure|kbd|del|mark|sub|sup)\b[^>]*>/i;

  // v1.6.0 起 userscript 抓的是「清洗后的语义 HTML」；旧分享存的是 Markdown 文本——两者都能渲染
  var purifyHooked = false;
  function renderContent(target, text) {
    var raw = String(text || '');
    try {
      if (window.DOMPurify) {
        if (!purifyHooked) {
          window.DOMPurify.addHook('afterSanitizeAttributes', function (node) {
            if (node.tagName === 'A') {
              node.setAttribute('target', '_blank');
              node.setAttribute('rel', 'noopener noreferrer');
            }
          });
          purifyHooked = true;
        }
        if (HTML_TAG_RE.test(raw)) {
          target.innerHTML = window.DOMPurify.sanitize(raw, { USE_PROFILES: { html: true } });
        } else if (window.marked) {
          target.innerHTML = window.DOMPurify.sanitize(window.marked.parse(raw, { breaks: true, gfm: true }), { USE_PROFILES: { html: true } });
        } else {
          target.textContent = raw;
        }
        return;
      }
    } catch (err) {
      console.error('render failed, falling back to plain text', err);
    }
    target.textContent = raw;
  }

  function modelLabel(models, side) {
    if (models && models[side]) return models[side];
    return side === 'a' ? '模型 A' : '模型 B';
  }

  var state = { models: null, turnModels: [], votedTurns: [] };

  function isTurnVoted(index) {
    return state.votedTurns.indexOf(index) !== -1;
  }

  function voteKey(index) { return 'abs_vote_' + SHARE_ID + '_' + index; }

  function storedChoice(index) {
    try { return window.localStorage.getItem(voteKey(index)) || null; } catch (_) { return null; }
  }
  function saveChoice(index, choice) {
    try { window.localStorage.setItem(voteKey(index), choice); } catch (_) { /* 私密模式等存不了就算了 */ }
  }

  // 优胜侧加绿色边框（仅 a/b 抉择；平局/两差没有优胜侧）+ 在头部加「你的选择」徽标
  function applyWinner(turnIndex, choice) {
    if (choice !== 'a' && choice !== 'b') return;
    var root = $('.turn[data-turn="' + turnIndex + '"]');
    if (!root) return;
    var cell = $('.cell[data-side="' + choice + '"]', root);
    if (cell) {
      cell.classList.add('winner');
      var head = $('.cell-head', cell);
      if (head && !$('.winner-badge', head)) {
        var badge = document.createElement('span');
        badge.className = 'winner-badge';
        badge.textContent = '你的选择';
        head.appendChild(badge);
      }
    }
  }

  function scrollToTurn(turnIndex) {
    var root = $('.turn[data-turn="' + turnIndex + '"]');
    if (root && root.scrollIntoView) root.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function applyHeaders(turnIndex) {
    var root = $('.turn[data-turn="' + turnIndex + '"]');
    if (!root) return;
    var models = state.turnModels[turnIndex] || state.models; // 每轮模型优先，回退整场（旧版分享）
    var show = isTurnVoted(turnIndex) && Boolean(models);
    $$('.cell-title[data-side]', root).forEach(function (el) {
      var side = el.getAttribute('data-side');
      el.textContent = show ? modelLabel(models, side) : (side === 'a' ? '模型 A' : '模型 B');
    });
  }

  function applyAllHeaders() {
    $$('.turn[data-turn]').forEach(function (el) {
      applyHeaders(Number(el.getAttribute('data-turn')));
    });
  }

  function disableTurnButtons(turnIndex, chosen) {
    $$('.turn[data-turn="' + turnIndex + '"] button.vote-btn').forEach(function (btn) {
      btn.disabled = true;
      if (chosen && btn.getAttribute('data-choice') === chosen) btn.classList.add('chosen');
    });
  }

  function renderTurns(turns) {
    var container = $('#turns');
    container.innerHTML = '';
    turns.forEach(function (turn, index) {
      var turnEl = document.createElement('section');
      turnEl.className = 'turn';
      turnEl.setAttribute('data-turn', String(index));

      if (turn.prompt && turn.prompt.trim()) {
        var promptEl = document.createElement('div');
        promptEl.className = 'prompt md';
        renderContent(promptEl, turn.prompt);
        turnEl.appendChild(promptEl);
      }

      var answers = document.createElement('div');
      answers.className = 'answers';
      ['a', 'b'].forEach(function (side) {
        var cell = document.createElement('div');
        cell.className = 'cell';
        cell.setAttribute('data-side', side);
        cell.innerHTML =
          '<div class="cell-head">' +
            '<div class="avatar">' + side.toUpperCase() + '</div>' +
            '<div class="cell-title" data-side="' + side + '">' + escapeHtml(side === 'a' ? '模型 A' : '模型 B') + '</div>' +
          '</div>';
        var body = document.createElement('div');
        body.className = 'cell-body md';
        var content = (turn.responses && turn.responses[side]) || '';
        if (content.trim()) {
          renderContent(body, content);
        } else {
          body.innerHTML = '<p style="color:var(--muted)">（该侧无内容）</p>';
        }
        cell.appendChild(body);
        answers.appendChild(cell);
      });
      turnEl.appendChild(answers);

      // 每一轮各自独立投票：哪个回答更好？ + 4 个按钮
      var vote = document.createElement('div');
      vote.className = 'turn-vote';
      vote.innerHTML =
        '<h2>哪个回答更好？</h2>' +
        '<div class="vote-buttons">' +
          '<button class="vote-btn" data-choice="a">A 更好</button>' +
          '<button class="vote-btn" data-choice="b">B 更好</button>' +
          '<button class="vote-btn" data-choice="tie">平局</button>' +
          '<button class="vote-btn" data-choice="bad">两个都差</button>' +
        '</div>';
      $$('.vote-btn', vote).forEach(function (btn) {
        btn.addEventListener('click', function () {
          if (isTurnVoted(index)) return;
          castVote(index, btn.getAttribute('data-choice'));
        });
      });
      turnEl.appendChild(vote);

      container.appendChild(turnEl);
    });
  }

  function showError(message) {
    $('#loading').hidden = true;
    $('#content').hidden = true;
    $('#error-box').hidden = false;
    if (message) $('#error-message').textContent = message;
  }

  function showShare(data) {
    state.models = data.models || null;
    state.turnModels = (Array.isArray(data.turns) ? data.turns : []).map(function (t) { return (t && t.models) || null; });
    state.votedTurns = Array.isArray(data.voted_turns) ? data.voted_turns.slice() : [];
    // 兼容旧版整场投票 cookie：data.voted === true 但没有 per-turn 信息时，所有轮次视为已投
    if (data.voted === true && state.votedTurns.length === 0 && Array.isArray(data.turns)) {
      state.votedTurns = data.turns.map(function (_, i) { return i; });
    }

    $('#loading').hidden = true;
    $('#error-box').hidden = true;
    $('#content').hidden = false;

    if (data.title) document.title = data.title;

    renderTurns(data.turns || []);
    applyAllHeaders();

    state.votedTurns.forEach(function (i) {
      var choice = storedChoice(i);
      disableTurnButtons(i, choice);
      if (choice) applyWinner(i, choice);
    });
  }

  async function castVote(turnIndex, choice) {
    var buttons = $$('.turn[data-turn="' + turnIndex + '"] button.vote-btn');
    buttons.forEach(function (b) { b.disabled = true; });
    try {
      var resp = await fetch('/api/vote/' + encodeURIComponent(SHARE_ID), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ choice: choice, turn: turnIndex }),
      });
      var data = await resp.json().catch(function () { return {}; });
      if (!resp.ok) {
        throw new Error((data && data.message) || ('投票失败（HTTP ' + resp.status + '）'));
      }
      if (state.votedTurns.indexOf(turnIndex) === -1) state.votedTurns.push(turnIndex);
      // 每轮揭晓只更新该轮；旧版分享 data.models 是整场通用的，也只放进该轮（投过的轮次本来就显示）
      if (data.models) state.turnModels[turnIndex] = data.models;
      applyHeaders(turnIndex);
      disableTurnButtons(turnIndex, choice);
      saveChoice(turnIndex, choice);
      applyWinner(turnIndex, choice);
      scrollToTurn(turnIndex); // 揭晓后把视角带到该轮头部，看清模型名与优胜框
    } catch (err) {
      console.error(err);
      alert(err.message || '投票失败，请稍后重试。');
      buttons.forEach(function (b) { b.disabled = false; });
    }
  }

  (async function load() {
    if (!SHARE_ID) { showError('链接中缺少分享 ID。'); return; }
    try {
      var resp = await fetch('/api/share/' + encodeURIComponent(SHARE_ID), { headers: { 'Accept': 'application/json' } });
      var data = await resp.json().catch(function () { return {}; });
      if (!resp.ok) {
        var msg = (data && data.message) || ('加载失败（HTTP ' + resp.status + '）');
        showError(msg);
        return;
      }
      showShare(data);
    } catch (err) {
      console.error(err);
      showError('网络错误，请稍后重试。');
    }
  })();
})();
</script>
</body>
</html>
